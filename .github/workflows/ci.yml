name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.node == '26.x' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.x', '24.x', '26.x']
        # macos-latest uses Apple Silicon; exercise the Intel native package too.
        include:
          - os: macos-15-intel
            node: '22.x'
          - os: macos-15-intel
            node: '24.x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
        if: runner.os != 'Windows'
      # Concurrent test files spawn multiple cold PowerShell ACL helpers on
      # shared Windows runners. Keep each file's own concurrency tests active.
      - run: node --import ./scripts/environment-support.js --test --test-concurrency=1
        if: runner.os == 'Windows'
      - run: node scripts/package-smoke.mjs
