name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
        if: runner.os != 'Windows'
      # Concurrent test files spawn multiple cold PowerShell ACL helpers on
      # shared Windows runners. Keep each file's own concurrency tests active.
      - run: npm test -- --test-concurrency=1
        if: runner.os == 'Windows'
      - run: node scripts/package-smoke.mjs
